# تحسينات على مستوى المجلد (.htaccess equivalent for Nginx)

# ضغط الاستجابات
location ~* \.(css|js|json)$ {
    gzip_static on;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary Accept-Encoding;
}

# كاش API محسن
location /api/theses/latest {
    add_header Cache-Control "public, max-age=300, s-maxage=600";
    add_header X-Cache-Level "L1";
}

location /api/stats {
    add_header Cache-Control "public, max-age=600, s-maxage=1200";
    add_header X-Cache-Level "L2";
}

# تحسين ملفات PDF
location ~* \.pdf$ {
    add_header Cache-Control "public, max-age=86400";
    add_header Content-Disposition "inline";
    add_header X-Content-Type-Options "nosniff";
}

# تحسين الأمان للـ API
location /api/ {
    add_header X-Robots-Tag "noindex, nofollow";
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";
}